<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogLytics — Reports</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-hero { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .page-hero h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .page-hero p  { font-size: 13px; color: var(--text-secondary); }

    .report-actions { display: flex; gap: 8px; }
    .act-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12.5px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s; border: none;
    }
    .act-btn svg { width: 14px; height: 14px; }
    .act-btn.primary { background: var(--accent-blue); color: white; }
    .act-btn.primary:hover { opacity: 0.85; }
    .act-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .act-btn.secondary:hover { border-color: var(--border-bright); color: var(--text-primary); }

    .report-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .r-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }
    .r-stat-label { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 8px; }
    .r-stat-val { font-family: 'Space Mono', monospace; font-size: 30px; font-weight: 700; }
    .r-stat-val.blue { color: var(--accent-blue); }
    .r-stat-val.red  { color: var(--accent-red); }
    .r-stat-val.yellow { color: var(--accent-yellow); }
    .r-stat-val.green { color: var(--accent-green); }
    .r-stat-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    .charts-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .chart-canvas-wrap { position: relative; height: 200px; width: 100%; }
    .chart-canvas-wrap canvas { display: block; }

    .top-messages {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .top-msg-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--text-primary);
    }
    .top-msg-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 12.5px;
    }
    .top-msg-row:last-child { border-bottom: none; }
    .top-msg-rank { font-family: 'Space Mono', monospace; color: var(--text-dim); width: 20px; flex-shrink: 0; }
    .top-msg-text { flex: 1; min-width: 0; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-msg-bar-wrap { width: 120px; flex-shrink: 0; }
    .top-msg-bar { height: 4px; border-radius: 2px; background: var(--accent-red); }
    .top-msg-count { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--accent-red); width: 32px; text-align: right; flex-shrink: 0; }

    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm13 0a4 4 0 100 8 4 4 0 000-8z"/></svg>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-icon" title="Dashboard" onclick="location.href='index.html'">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div class="nav-icon" title="Explore" onclick="location.href='explore.html'">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <div class="nav-icon" title="Alerts" onclick="location.href='alerts.html'">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="nav-icon active" title="Reports">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="nav-icon" title="Settings" onclick="location.href='settings.html'">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>
  </aside>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm13 0a4 4 0 100 8 4 4 0 000-8z"/></svg></div>
      LogLytics
    </div>
    <nav class="topbar-nav">
      <a href="index.html">Dashboard</a>
      <a href="explore.html">Explore</a>
      <a href="alerts.html">Alerts</a>
      <a href="reports.html" class="active">Reports</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="topbar-right">
      <div class="notif-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-dot"></span>
      </div>
      <div class="user-chip">
        <div class="avatar">PS</div>
        <div class="user-info"><div class="user-name">Priyankori Saha</div><div class="user-role">Admin</div></div>
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:12px;height:12px;color:var(--text-dim)"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="content">
      <div class="page-hero">
        <div>
          <h2>Reports</h2>
          <p>Aggregated statistics and exportable summaries from your log database.</p>
        </div>
        <div class="report-actions">
          <button class="act-btn secondary" id="exportCsvBtn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
          </button>
          <button class="act-btn secondary" id="exportJsonBtn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export JSON
          </button>
          <button class="act-btn primary" id="refreshBtn">
            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
          </button>
        </div>
      </div>

      <!-- Summary stats -->
      <div class="report-stats">
        <div class="r-stat">
          <div class="r-stat-label">Total Logs</div>
          <div class="r-stat-val blue" id="rTotal">—</div>
          <div class="r-stat-sub">all time</div>
        </div>
        <div class="r-stat">
          <div class="r-stat-label">Total Errors</div>
          <div class="r-stat-val red" id="rErrors">—</div>
          <div class="r-stat-sub" id="rErrorPct">—</div>
        </div>
        <div class="r-stat">
          <div class="r-stat-label">Total Warnings</div>
          <div class="r-stat-val yellow" id="rWarnings">—</div>
          <div class="r-stat-sub" id="rWarnPct">—</div>
        </div>
        <div class="r-stat">
          <div class="r-stat-label">Info Events</div>
          <div class="r-stat-val green" id="rInfo">—</div>
          <div class="r-stat-sub" id="rInfoPct">—</div>
        </div>
      </div>

      <!-- Charts -->
      <div class="charts-2col">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Log Type Breakdown</span></div>
          <div class="chart-wrap">
            <div class="chart-canvas-wrap"><canvas id="barChart"></canvas></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Distribution</span></div>
          <div class="chart-wrap">
            <div class="chart-canvas-wrap"><canvas id="pieChart"></canvas></div>
          </div>
        </div>
      </div>

      <!-- Top repeated messages -->
      <div class="top-messages">
        <div class="top-msg-header">Top Repeated Error Messages</div>
        <div id="topMsgList">
          <div style="padding:30px;text-align:center;color:var(--text-dim)"><span class="spinner"></span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    const API_BASE = 'http://localhost:5000/api';
    let allLogs = [];

    const chartDefaults = {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10,16,28,0.92)',
          borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
          titleColor: '#7a8aa0', bodyColor: '#e8edf5',
          titleFont: { family: "'Space Mono', monospace", size: 10 },
          bodyFont: { family: "'DM Sans', sans-serif", size: 12 },
          padding: 10,
        }
      }
    };

    let barChart, pieChart;

    function buildCharts(summary) {
      const labels = ['ERROR', 'WARNING', 'INFO'];
      const values = [summary.ERROR, summary.WARNING, summary.INFO];
      const colors = ['#ef4444', '#f59e0b', '#22c55e'];

      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: colors.map(c => c + '33'),
            borderColor: colors,
            borderWidth: 2,
            borderRadius: 6,
          }]
        },
        options: {
          ...chartDefaults,
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a5568', font: { size: 11 } }, border: { display: false } },
            y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a5568', font: { size: 11 } }, border: { display: false } }
          }
        }
      });

      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: colors, borderColor: 'rgba(8,12,20,0)', borderWidth: 3, hoverOffset: 6 }]
        },
        options: {
          ...chartDefaults,
          cutout: '60%',
          plugins: {
            ...chartDefaults.plugins,
            legend: {
              display: true,
              position: 'bottom',
              labels: { color: '#7a8aa0', font: { size: 11 }, padding: 16, boxWidth: 10 }
            }
          }
        }
      });
    }

    function renderTopMessages(errors) {
      const map = {};
      errors.forEach(l => { const k = l.message.trim(); map[k] = (map[k]||0) + 1; });
      const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0, 10);
      const maxCount = sorted[0]?.[1] || 1;
      const container = document.getElementById('topMsgList');
      if (!sorted.length) {
        container.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:12px">
            <div style="width:56px;height:56px;border-radius:50%;background:rgba(34,197,94,.1);
              display:flex;align-items:center;justify-content:center">
              <svg width="26" height="26" fill="none" stroke="#22c55e" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <div style="font-size:14px;font-weight:600;color:var(--accent-green)">No Errors Found</div>
            <div style="font-size:12.5px;color:var(--text-secondary);text-align:center;line-height:1.6">
              Upload a log file from the Dashboard to see error analysis here.
            </div>
          </div>`;
        return;
      }
      container.innerHTML = sorted.map(([msg, count], i) => `
        <div class="top-msg-row">
          <span class="top-msg-rank">${i+1}</span>
          <span class="top-msg-text" title="${msg.replace(/"/g,'&quot;')}">${msg.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>
          <div class="top-msg-bar-wrap">
            <div class="top-msg-bar" style="width:${Math.round((count/maxCount)*100)}%"></div>
          </div>
          <span class="top-msg-count">${count}</span>
        </div>`).join('');
    }

    async function load() {
      try {
        const res = await fetch(`${API_BASE}/logs`);
        const data = await res.json();
        allLogs = data.logs || [];
        const s = data.summary || { ERROR: 0, WARNING: 0, INFO: 0 };
        const t = data.total || 0;

        document.getElementById('rTotal').textContent    = t.toLocaleString();
        document.getElementById('rErrors').textContent   = s.ERROR.toLocaleString();
        document.getElementById('rWarnings').textContent = s.WARNING.toLocaleString();
        document.getElementById('rInfo').textContent     = s.INFO.toLocaleString();
        const pct = v => t > 0 ? ((v/t)*100).toFixed(1)+'% of total' : '—';
        document.getElementById('rErrorPct').textContent = pct(s.ERROR);
        document.getElementById('rWarnPct').textContent  = pct(s.WARNING);
        document.getElementById('rInfoPct').textContent  = pct(s.INFO);

        buildCharts(s);
        renderTopMessages(allLogs.filter(l => l.type === 'ERROR'));
      } catch(e) {
        document.getElementById('rTotal').textContent = '—';
        document.getElementById('topMsgList').innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:12px">
            <div style="width:56px;height:56px;border-radius:50%;background:rgba(239,68,68,.1);
              display:flex;align-items:center;justify-content:center">
              <svg width="26" height="26" fill="none" stroke="#ef4444" stroke-width="1.8" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>
            <div style="font-size:14px;font-weight:600;color:var(--accent-red)">Backend Unreachable</div>
            <div style="font-size:12.5px;color:var(--text-secondary);text-align:center;max-width:280px;line-height:1.6">
              Start your Node.js server on port 5000, then click Refresh.
            </div>
          </div>`;
      }
    }

    function exportCSV() {
      if (!allLogs.length) return alert('No data loaded yet.');
      const rows = allLogs.map(l => `"${l.timestamp}","${l.type}","${l.message.replace(/"/g,'""')}"`);
      const blob = new Blob(['Timestamp,Level,Message\n' + rows.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `report_${Date.now()}.csv`; a.click();
    }

    function exportJSON() {
      if (!allLogs.length) return alert('No data loaded yet.');
      const blob = new Blob([JSON.stringify(allLogs, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `report_${Date.now()}.json`; a.click();
    }

    document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);
    document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
    document.getElementById('refreshBtn').addEventListener('click', load);
    load();
  </script>
</body>
</html>
