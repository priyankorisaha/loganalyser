<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogLytics — Explore</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .explore-shell { display:grid; grid-template-columns: 260px 1fr 320px; gap:14px; }
    .workspace-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
    .panel-title-row { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); }
    .title-xs { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-dim); }
    .filter-group { padding:12px 14px; border-bottom:1px solid var(--border); }
    .filter-group h4 { margin:0 0 10px; font-size:13px; }
    .chip-list { display:flex; flex-wrap:wrap; gap:7px; }
    .chip { padding:5px 10px; border:1px solid var(--border); border-radius:999px; font-size:12px; color:var(--text-secondary); cursor:pointer; }
    .chip.active { border-color: var(--accent-blue); color: var(--text-primary); background: rgba(79,142,247,.12); }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
    .field label { font-size:11px; color:var(--text-dim); text-transform:uppercase; }
    .field input, .field select { padding:8px 10px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--text-primary); border-radius:8px; font-size:12px; font-family:'DM Sans',sans-serif; }
    .saved-list button { width:100%; text-align:left; background:transparent; border:1px solid var(--border); color:var(--text-secondary); border-radius:8px; padding:8px 10px; margin-bottom:8px; cursor:pointer; font-size:12px; }
    .search-top { display:flex; gap:10px; margin-bottom:12px; }
    .search-input-wrap { flex:1; position:relative; }
    .search-input-wrap input { width:100%; padding:11px 14px 11px 40px; border:1px solid var(--border); border-radius:10px; background:var(--bg-card); color:var(--text-primary); font-size:13px; }
    .search-input-wrap svg { position:absolute; left:13px; top:10px; width:16px; height:16px; color:var(--text-dim); }
    .btn { border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); padding:9px 12px; border-radius:9px; cursor:pointer; }
    .btn.primary { background:var(--accent-blue); border-color:var(--accent-blue); color:#fff; }
    .table-wrap { max-height:560px; overflow:auto; }
    .explore-table td, .explore-table th { padding:10px 12px; font-size:12px; }
    .explore-table tr.details td { background: rgba(79,142,247,.06); color:var(--text-secondary); white-space:pre-wrap; }
    mark { background: rgba(245,158,11,.3); color:inherit; padding:0 2px; border-radius:4px; }
    .insight-list { padding:10px 12px; }
    .insight-item { padding:10px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; }
    .insight-item .k { font-size:11px; color:var(--text-dim); text-transform:uppercase; }
    .insight-item .v { font-size:14px; margin-top:4px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm13 0a4 4 0 100 8 4 4 0 000-8z"/></svg></div>
    <nav class="sidebar-nav">
      <div class="nav-icon" title="Dashboard" onclick="location.href='index.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
      <div class="nav-icon active" title="Explore"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
      <div class="nav-icon" title="Alerts" onclick="location.href='alerts.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
      <div class="nav-icon" title="Reports" onclick="location.href='reports.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    </nav>
    <div class="sidebar-bottom"><div class="nav-icon" title="Settings" onclick="location.href='settings.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div></div>
  </aside>

  <header class="topbar">
    <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm13 0a4 4 0 100 8 4 4 0 000-8z"/></svg></div>LogLytics</div>
    <nav class="topbar-nav"><a href="index.html">Dashboard</a><a href="explore.html" class="active">Explore</a><a href="alerts.html">Alerts</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a></nav>
    <div class="topbar-right"><div class="notif-btn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></div><div class="user-chip"><div class="avatar">PS</div><div class="user-info"><div class="user-name">Priyankori Saha</div><div class="user-role">Admin</div></div></div></div>
  </header>

  <main class="main">
    <div class="content">
      <div class="search-top">
        <div class="search-input-wrap">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="queryInput" placeholder='Try: level:error source:webserver message:"database failed" after:2pm before:5pm' />
        </div>
        <button class="btn primary" id="searchBtn">Run Query</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>

      <div class="explore-shell">
        <section class="workspace-panel">
          <div class="panel-title-row"><strong>Filters</strong><span class="title-xs">Left Sidebar</span></div>
          <div class="filter-group"><h4>Severity</h4><div class="chip-list" id="severityChips"></div></div>
          <div class="filter-group"><h4>Source</h4><div class="chip-list" id="sourceChips"></div></div>
          <div class="filter-group">
            <h4>Date Range</h4>
            <div class="field"><label>Start</label><input type="datetime-local" id="startTime"></div>
            <div class="field"><label>End</label><input type="datetime-local" id="endTime"></div>
            <div class="field"><label>Regex Mode</label><select id="regexMode"><option value="off">Disabled</option><option value="on">Enabled</option></select></div>
          </div>
          <div class="filter-group saved-list">
            <h4>Saved Searches</h4>
            <button data-q='level:error source:database'>Database Errors</button>
            <button data-q='source:webserver level:warning'>Webserver Warnings</button>
            <button data-q='message:"timeout" after:1pm'>Timeouts After 1 PM</button>
          </div>
        </section>

        <section class="workspace-panel">
          <div class="panel-title-row"><strong>Log Investigation Table</strong><span id="resultMeta" class="title-xs">0 Results</span></div>
          <div class="table-wrap">
            <table class="explore-table">
              <thead><tr><th>Time</th><th>Level</th><th>Source</th><th>Message</th></tr></thead>
              <tbody id="logRows"></tbody>
            </table>
          </div>
        </section>

        <aside class="workspace-panel">
          <div class="panel-title-row"><strong>Insights</strong><span class="title-xs">Right Panel</span></div>
          <div class="insight-list" id="insightList"></div>
        </aside>
      </div>
    </div>
  </main>

<script>
const API_BASE='http://localhost:5000/api';
const state={logs:[],filtered:[],expanded:new Set(),severity:new Set(),source:new Set()};
const severities=['ERROR','WARNING','CRITICAL','INFO'];
const sources=['webserver','database','auth','payments','network'];

function chipRender(id,values,set){
  const el=document.getElementById(id);
  el.innerHTML=values.map(v=>`<span class="chip ${set.has(v)?'active':''}" data-v="${v}">${v}</span>`).join('');
  el.onclick=e=>{
    if(!e.target.dataset.v)return;
    const v=e.target.dataset.v;
    set.has(v)?set.delete(v):set.add(v);
    chipRender(id,values,set);
    applyFilters();
  };
}

function parseQuery(q){
  const out={};
  (q.match(/(?:"[^"]+"|\S+)/g)||[]).forEach(t=>{
    const i=t.indexOf(':');
    if(i>0) out[t.slice(0,i).toLowerCase()]=t.slice(i+1).replace(/^"|"$/g,'');
    else out.text=(out.text?out.text+' ':'')+t;
  });
  return out;
}

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(msg,term){
  if(!term) return escapeHtml(msg);
  const safe=escapeHtml(msg);
  return safe.replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>`<mark>${m}</mark>`);
}

function applyFilters(){
  const q=parseQuery(document.getElementById('queryInput').value.trim());
  const st=document.getElementById('startTime').value, en=document.getElementById('endTime').value;
  const rg=document.getElementById('regexMode').value==='on';

  state.filtered=state.logs.filter(l=>{
    const lt=(l.type||'').toUpperCase();
    const ls=(l.source||'').toLowerCase();
    const msg=(l.message||'');

    if(state.severity.size&&!state.severity.has(lt)) return false;
    if(state.source.size&&!state.source.has(ls)) return false;
    if(q.level&&lt!==q.level.toUpperCase()) return false;
    if(q.source&&ls!==q.source.toLowerCase()) return false;
    if(q.message&&!(rg?new RegExp(q.message,'i').test(msg):msg.toLowerCase().includes(q.message.toLowerCase()))) return false;
    if(q.text&&!msg.toLowerCase().includes(q.text.toLowerCase())) return false;

    const ts=Date.parse(l.timestamp);
    if(st&&ts<Date.parse(st)) return false;
    if(en&&ts>Date.parse(en)) return false;
    return true;
  });

  render();
}

function render(){
  const body=document.getElementById('logRows');
  const q=parseQuery(document.getElementById('queryInput').value);
  const term=q.message||q.text;

  body.innerHTML=state.filtered.map((l,i)=>`
    <tr data-i="${i}" class="main">
      <td>${escapeHtml(l.timestamp||'')}</td>
      <td>${escapeHtml(l.type||'')}</td>
      <td>${escapeHtml(l.source||'app')}</td>
      <td>${highlight(l.message||'',term)}</td>
    </tr>
    ${state.expanded.has(i)?`<tr class="details"><td colspan="4">${escapeHtml(l.meta?JSON.stringify(l.meta,null,2):'No extra metadata')}</td></tr>`:''}
  `).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:26px">No matching logs</td></tr>';

  body.querySelectorAll('tr.main').forEach(r=>r.onclick=()=>{
    const i=Number(r.dataset.i);
    state.expanded.has(i)?state.expanded.delete(i):state.expanded.add(i);
    render();
  });

  document.getElementById('resultMeta').textContent=`${state.filtered.length} Results`;

  const freq={},src={};
  state.filtered.forEach(l=>{
    freq[l.type]=(freq[l.type]||0)+1;
    src[l.source||'unknown']=(src[l.source||'unknown']||0)+1;
  });

  const topErr=Object.entries(state.filtered.reduce((m,l)=>{
    if((l.type||'').includes('ERROR')) m[l.message]=(m[l.message]||0)+1;
    return m;
  },{})).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('insightList').innerHTML=`
    <div class='insight-item'><div class='k'>Top Recurring Error</div><div class='v'>${topErr?escapeHtml(topErr[0])+' ('+topErr[1]+')':'None'}</div></div>
    <div class='insight-item'><div class='k'>Most Active Source</div><div class='v'>${escapeHtml(Object.entries(src).sort((a,b)=>b[1]-a[1])[0]?.[0]||'N/A')}</div></div>
    <div class='insight-item'><div class='k'>Severity Split</div><div class='v'>${escapeHtml(Object.entries(freq).map(([k,v])=>k+': '+v).join(' • ')||'N/A')}</div></div>
    <div class='insight-item'><div class='k'>AI Insight</div><div class='v'>${state.filtered.length>100?'Spike detected in log volume.':'System appears stable at current rate.'}</div></div>
  `;
}

async function load(){
  try{
    const r=await fetch(`${API_BASE}/logs`);
    const d=await r.json();
    state.logs=d.logs||[];
  }catch{
    state.logs=[];
  }
  applyFilters();
}

chipRender('severityChips',severities,state.severity);
chipRender('sourceChips',sources,state.source);
document.getElementById('searchBtn').onclick=applyFilters;
document.getElementById('clearBtn').onclick=()=>{
  document.getElementById('queryInput').value='';
  document.getElementById('startTime').value='';
  document.getElementById('endTime').value='';
  document.getElementById('regexMode').value='off';
  state.severity.clear();
  state.source.clear();
  chipRender('severityChips',severities,state.severity);
  chipRender('sourceChips',sources,state.source);
  applyFilters();
};
document.querySelectorAll('.saved-list button').forEach(b=>b.onclick=()=>{
  document.getElementById('queryInput').value=b.dataset.q;
  applyFilters();
});

load();
</script>
</body>
</html>
